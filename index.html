<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short-DNA oligo assembler</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#667085;--line:#e1e5ec;--acc:#2457c5;
--arm:#d9892b;--sp:#2f8f6b;--F:#2457c5;--M:#7a4bc2;--R:#c2412d;--ok:#1f8a4c;--warn:#b9770e;--bad:#c2312d;--okbg:#e6f4ec;--warnbg:#fbf0dc;--badbg:#fbe4e2}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--ink:#e6e9ef;--muted:#98a1b3;--line:#2c3240;--acc:#7aa2f7;
--arm:#e0a050;--sp:#52b788;--F:#7aa2f7;--M:#b794f4;--R:#f08a78;--ok:#58c27d;--warn:#e0a84a;--bad:#f07a74;--okbg:#17301f;--warnbg:#33290f;--badbg:#3a1a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.langsw{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.langsw button{border:0;border-radius:0;padding:5px 11px;font-size:12.5px}
.langsw button[aria-pressed=true]{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
textarea,input[type=text],input[type=number]{width:100%;font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
textarea{min-height:150px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:110px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:hover{filter:brightness(.96)}
.note{font-size:12px;color:var(--muted)}
.note b{color:var(--ink)}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;margin-right:6px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.sp-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sp-head b{font-size:15px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
td.seq{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-size:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.chk{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px}
.chk li{padding:1px 0}.chk .ok{color:var(--ok)}.chk .bad{color:var(--bad)}
.warns{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--warn)}
svg text{font:11px ui-monospace,Menlo,Consolas,monospace;fill:var(--ink)}
svg .lbl{font:11px -apple-system,"Noto Sans CJK SC",sans-serif;fill:var(--muted)}
.legend span{display:inline-block;margin-right:12px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
details summary{cursor:pointer;color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
  <div>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="sub"></p>
  </div>
  <div class="langsw">
    <button id="lang-zh" onclick="setLang('zh')">中文</button><button id="lang-en" onclick="setLang('en')">English</button>
  </div>
</div>

<div class="card">
  <h2 data-i18n="bg_h"></h2>
  <p class="note" data-i18n="bg_p"></p>
</div>

<div class="grid">
<div class="card">
  <h2 data-i18n="s1_h"></h2>
  <label data-i18n="s1_lb"></label>
  <textarea id="input" spellcheck="false" wrap="off"></textarea>
  <div style="margin-top:8px"><button onclick="loadExample()" data-i18n="btn_example"></button> <button class="primary" onclick="run()" data-i18n="btn_run"></button></div>
</div>
<div class="card">
  <h2 data-i18n="s2_h"></h2>
  <label data-i18n="lb_up"></label><input type="text" id="up" value="GGAGAGGGACGCGT">
  <label data-i18n="lb_down"></label><input type="text" id="down" value="TGGCCATTAACCGC">
  <div class="row">
    <div><label data-i18n="lb_maxLen"></label><input type="number" id="maxLen" value="60"></div>
    <div><label data-i18n="lb_minOv"></label><input type="number" id="minOv" value="18"></div>
    <div><label data-i18n="lb_maxOv"></label><input type="number" id="maxOv" value="45"></div>
  </div>
  <div class="row">
    <div><label data-i18n="lb_tmLow"></label><input type="number" id="tmLow" value="59" step="0.5"></div>
    <div><label data-i18n="lb_tmHigh"></label><input type="number" id="tmHigh" value="61" step="0.5"></div>
    <div><label data-i18n="lb_tmFloor"></label><input type="number" id="tmFloor" value="55" step="0.5"></div>
  </div>
  <label style="margin-top:10px"><input type="checkbox" id="orf" checked> <span data-i18n="lb_orf"></span></label>
  <p class="note" style="margin-top:8px" data-i18n="note_params"></p>
</div>
</div>

<div id="out"></div>
</div>

<script>
/* ======================= 核心：序列与 Tm ======================= */
const COMP={A:'T',T:'A',G:'C',C:'G'};
const rc=s=>{let o='';for(let i=s.length-1;i>=0;i--)o+=COMP[s[i]];return o};
const gcPct=s=>{let n=0;for(const c of s)if(c==='G'||c==='C')n++;return 100*n/s.length};
// SantaLucia 1998 最近邻参数（DNA/DNA）；dH kcal/mol，dS cal/mol/K
const NNP={AA:[-7.9,-22.2],TT:[-7.9,-22.2],AT:[-7.2,-20.4],TA:[-7.2,-21.3],CA:[-8.5,-22.7],TG:[-8.5,-22.7],GT:[-8.4,-22.4],AC:[-8.4,-22.4],CT:[-7.8,-21.0],AG:[-7.8,-21.0],GA:[-8.2,-22.2],TC:[-8.2,-22.2],CG:[-10.6,-27.2],GC:[-9.8,-24.4],GG:[-8.0,-19.9],CC:[-8.0,-19.9]};
// 盐校正用熵项式 dS += 0.368·(N-1)·ln[Na+]；50 mM Na+、0.9 µM 的取值校准到与 SnapGene 读数一致（±1 °C）
const TM_NA=0.05,TM_CT=0.9e-6;
function tm(seq){
  let dH=0,dS=0;
  for(const b of [seq[0],seq[seq.length-1]]){ if(b==='G'||b==='C'){dH+=0.1;dS-=2.8}else{dH+=2.3;dS+=4.1} }
  for(let i=0;i<seq.length-1;i++){const p=NNP[seq.slice(i,i+2)];dH+=p[0];dS+=p[1]}
  dS+=0.368*(seq.length-1)*Math.log(TM_NA);
  return (dH*1000)/(dS+1.987*Math.log(TM_CT/4))-273.15;
}
const CODON={TTT:'F',TTC:'F',TTA:'L',TTG:'L',CTT:'L',CTC:'L',CTA:'L',CTG:'L',ATT:'I',ATC:'I',ATA:'I',ATG:'M',GTT:'V',GTC:'V',GTA:'V',GTG:'V',TCT:'S',TCC:'S',TCA:'S',TCG:'S',CCT:'P',CCC:'P',CCA:'P',CCG:'P',ACT:'T',ACC:'T',ACA:'T',ACG:'T',GCT:'A',GCC:'A',GCA:'A',GCG:'A',TAT:'Y',TAC:'Y',TAA:'*',TAG:'*',CAT:'H',CAC:'H',CAA:'Q',CAG:'Q',AAT:'N',AAC:'N',AAA:'K',AAG:'K',GAT:'D',GAC:'D',GAA:'E',GAG:'E',TGT:'C',TGC:'C',TGA:'*',TGG:'W',CGT:'R',CGC:'R',CGA:'R',CGG:'R',AGT:'S',AGC:'S',AGA:'R',AGG:'R',GGT:'G',GGC:'G',GGA:'G',GGG:'G'};
function translate(dna){let o='';for(let i=0;i+2<dna.length;i+=3)o+=CODON[dna.slice(i,i+3)]||'?';return o}

/* ======================= 文案（中 / 英） ======================= */

  sub:'Paste the DNA you want to make (up to ~130 bp, arms optional) → get three oligos F / M / R → verified in-page by a PCR simulation → export an order sheet. Runs in your browser; sequences are never uploaded.',
  bg_h:'Why do it this way',
  bg_p:'Oligos are priced per base, but most vendors quote that price only up to about <b>60 nt</b>. Beyond that you move to a different synthesis scale or purification and the per-base price climbs, while the compounding stepwise coupling efficiency leaves a smaller fraction of full-length product in every longer oligo. Ordering the fragment as a synthetic gene instead usually runs into a minimum per-fragment charge, so a ~100 bp piece costs the same as a much larger one. Splitting the target into three ordinary oligos of ≤60 nt and joining them in a single PCR is normally far cheaper and faster. It suits short, defined sequences: signal peptides, linkers, tags, short promoters/RBS/terminators. Check the actual prices with your own vendor.',

  err_nodesign:(maxLen,tmFloor,L)=>`No feasible set of three oligos with ≤${maxLen} nt each and overlap Tm ≥${tmFloor} °C (fragment ${L} bp). Raise the length cap or lower the Tm floor.`,
  chk_chars:'all three oligos contain only A/C/G/T',
  chk_len:(m,f,x,r)=>`all three are ≤${m} nt (F ${f}, M ${x}, R ${r})`,
  chk_overflow:'the PCR simulation converges (no runaway mispriming)',
  chk_T:n=>`F/M/R assemble the full top strand (${n} nt)`,
  chk_rT:'the full bottom strand is formed',
  chk_offtarget:n=>n?`${n} strand(s) formed that are not part of the target product (mispriming)`:'every intermediate is part of the target product; no mispriming products',
  chk_arms:'the product starts with the upstream arm and ends with the downstream arm',
  chk_spmid:'the sequence between the arms matches the target DNA exactly',
  chk_startF:'F is a prefix of the top strand',
  chk_startR:'R is a prefix of the bottom strand',
  chk_atg:'the sequence starts with ATG',
  chk_frame:n=>`the sequence length ${n} nt is a multiple of 3`,
  chk_stop:'no internal stop codon',
  chk_aa:(ok,a,b)=>ok?'the translation matches the expected amino acids':`translation differs from the expected amino acids: ${a} ≠ ${b}`,
  adv_low:(tm,lo,hi)=>`Lowest overlap Tm is ${tm} °C, below the ${lo}–${hi} °C window. Run a 52–62 °C gradient the first time.`,
  adv_high:tm=>`Highest overlap Tm is ${tm} °C, well above the window (harmless at 60 °C, but mispriming risk rises).`,
  adv_dtm:d=>`The two overlaps differ by ${d} °C in Tm; keeping it under 1 °C is better.`,
  adv_gc:(n,gc)=>`${n} overlap is ${gc}% GC, outside 40–60%.`,
  adv_f3:'F does not end in G/C at its 3′ end.',
  adv_r3:'R does not end in G/C at its 3′ end.',
  adv_dimer:'The 3′ terminal 3 nt of F and R are complementary; primer dimers are possible.',
  adv_run:'Contains a run of ≥6 identical bases (it comes from the sequence itself; watch synthesis and annealing).'
}};
let LANG='zh';
function T(k,...a){const v=I18N[LANG][k];return typeof v==='function'?v(...a):v}

/* ======================= 设计器 ======================= */
const DEFAULTS={up:'GGAGAGGGACGCGT',down:'TGGCCATTAACCGC',maxLen:60,minOv:18,maxOv:45,tmFloor:55,tmLow:59,tmHigh:61};
function windowsOf(full,cfg){
  const L=full.length,out=[];
  for(let a=0;a<L;a++)for(let n=cfg.minOv;n<=cfg.maxOv&&a+n<=L;n++){
    const s=full.slice(a,a+n);out.push({a,b:a+n,tm:tm(s),gc:gcPct(s)});
  }
  return out;
}
function design(name,sp,userCfg){
  const cfg=Object.assign({},DEFAULTS,userCfg||{});
  const full=cfg.up+sp+cfg.down,L=full.length;
  const W=windowsOf(full,cfg).filter(w=>w.tm>=cfg.tmFloor);
  const left=W.filter(w=>w.b<=cfg.maxLen);            // F = full[0:b]，M 从 a 开始
  const right=W.filter(w=>w.a>=L-cfg.maxLen);         // R = rc(full[a:L])，M 到 b 结束
  const isGC=c=>c==='G'||c==='C';
  let best=null,feasible=0;
  for(const l of left)for(const r of right){
    if(!(l.a<r.a&&l.b<r.b))continue;                  // M 须从 F 的 5′ 侧起、到 R 的 3′ 侧止；F 与 R 允许直接重叠
    const Mlen=r.b-l.a; if(Mlen>cfg.maxLen)continue;
    feasible++;
    const flen=l.b,rlen=L-r.a,minT=Math.min(l.tm,r.tm),dT=Math.abs(l.tm-r.tm);
    const clamp=(isGC(full[l.b-1])?1:0)+(isGC(full[r.a])?1:0);   // F 3′ 末碱基；R 3′ 末碱基 = full[r.a] 的互补
    const gcBad=(l.gc<35||l.gc>65?1:0)+(r.gc<35||r.gc>65?1:0);
    const out=x=>Math.max(cfg.tmLow-x,x-cfg.tmHigh,0);     // 离目标窗口的距离
    const F=full.slice(0,l.b),R=rc(full.slice(r.a)),dimer=rc(F.slice(-3))===R.slice(-3)?1:0;   // F/R 3′ 端 3 nt 互补
    const score=[Math.round((out(l.tm)+out(r.tm))*4)/4,dimer,Math.round(dT*2)/2,-clamp,gcBad,flen+Mlen+rlen];
    if(!best||cmpArr(score,best.score)<0)best={score,l,r,flen,Mlen,rlen};
  }
  if(!best)return {name,sp,ok:false,error:T('err_nodesign',cfg.maxLen,cfg.tmFloor,L),cfg,full};
  const {l,r}=best;
  const F=full.slice(0,l.b),M=full.slice(l.a,r.b),R=rc(full.slice(r.a));
  return {name,sp,cfg,full,F,M,R,ok:true,feasible,
    ovF:{a:l.a,b:l.b,seq:full.slice(l.a,l.b),tm:l.tm,gc:l.gc},
    ovR:{a:r.a,b:r.b,seq:full.slice(r.a,r.b),tm:r.tm,gc:r.gc}};
}
function cmpArr(x,y){for(let i=0;i<x.length;i++){if(x[i]!==y[i])return x[i]<y[i]?-1:1}return 0}

/* ======================= 独立验证：模拟 PCR 闭包 =======================
   只看最终的三条寡核苷酸（不看设计器的内部结果）。每条链的 3′ 端 nmin nt 若能与另一条链配对，
   就沿模板延伸到模板 5′ 端；反复直到没有新链。 */
function closure(oligos,nmin=12,cap=400){
  const pool=new Set(oligos);let changed=true,overflow=false;
  while(changed&&!overflow){
    changed=false;const arr=[...pool];
    for(const x of arr){
      if(x.length<nmin)continue;
      const key=rc(x.slice(-nmin));
      for(const y of arr){
        let j=y.indexOf(key);
        while(j!==-1){
          const nw=x+rc(y.slice(0,j));
          if(!pool.has(nw)){pool.add(nw);changed=true;if(pool.size>cap){overflow=true;break}}
          j=y.indexOf(key,j+1);
        }
        if(overflow)break;
      }
      if(overflow)break;
    }
  }
  return {pool,overflow};
}
function verify(spec){
  const {up,down,sp,F,M,R}=spec,maxLen=spec.maxLen||60,checks=[];
  const add=(id,ok,msg)=>checks.push({id,ok,msg});
  const T2=(k,...a)=>T(k,...a);
  const Tt=up+sp+down,rT=rc(Tt);
  add('chars',[F,M,R].every(s=>/^[ACGT]+$/.test(s)),T2('chk_chars'));
  add('len',[F,M,R].every(s=>s.length<=maxLen),T2('chk_len',maxLen,F.length,M.length,R.length));
  if(!checks[0].ok)return {ok:false,checks,T:Tt};
  const {pool,overflow}=closure([F,M,R]);
  add('overflow',!overflow,T2('chk_overflow'));
  add('T',pool.has(Tt),T2('chk_T',Tt.length));
  add('rT',pool.has(rT),T2('chk_rT'));
  const off=[...pool].filter(s=>!Tt.includes(s)&&!rT.includes(s));
  add('offtarget',off.length===0,T2('chk_offtarget',off.length));
  add('arms',Tt.startsWith(up)&&Tt.endsWith(down),T2('chk_arms'));
  add('spmid',Tt.slice(up.length,Tt.length-down.length)===sp,T2('chk_spmid'));
  add('startF',F===Tt.slice(0,F.length),T2('chk_startF'));
  add('startR',R===rT.slice(0,R.length),T2('chk_startR'));
  let aa=null;
  if(spec.orf!==false){                                  // 编码序列检查；合成非编码 DNA 时关闭
    aa=translate(sp);
    add('atg',sp.startsWith('ATG'),T2('chk_atg'));
    add('frame',sp.length%3===0,T2('chk_frame',sp.length));
    add('stop',!aa.slice(0,-1).includes('*')&&!aa.includes('?'),T2('chk_stop'));
    if(spec.expectedAA){const ok=aa===spec.expectedAA;add('aa',ok,T2('chk_aa',ok,aa,spec.expectedAA))}
  }
  return {ok:checks.every(c=>c.ok),checks,T:Tt,aa,pool:[...pool]};
}
function adviceFor(d){
  const w=[];
  const mt=Math.min(d.ovF.tm,d.ovR.tm);
  if(mt<d.cfg.tmLow-0.5)w.push(T('adv_low',mt.toFixed(1),d.cfg.tmLow,d.cfg.tmHigh));
  const mx=Math.max(d.ovF.tm,d.ovR.tm);
  if(mx>d.cfg.tmHigh+2)w.push(T('adv_high',mx.toFixed(1)));
  if(Math.abs(d.ovF.tm-d.ovR.tm)>1)w.push(T('adv_dtm',Math.abs(d.ovF.tm-d.ovR.tm).toFixed(1)));
  for(const [n,o] of [['F–M',d.ovF],['M–R',d.ovR]])if(o.gc<40||o.gc>60)w.push(T('adv_gc',n,o.gc.toFixed(0)));
  if(!/[GC]$/.test(d.F))w.push(T('adv_f3'));
  if(!/[GC]$/.test(d.R))w.push(T('adv_r3'));
  if(rc(d.F.slice(-3))===d.R.slice(-3))w.push(T('adv_dimer'));           // F 与 R 3′ 端互补 ≥3 nt
  if([d.F,d.M,d.R].some(o=>/(.)\1{5,}/.test(o)))w.push(T('adv_run'));
  return w;
}

const EXAMPLE=`C01 ATGCGTTCTTATATAAAAGTCCTAACAATGTGTTTTCTGGGGCTCATACTTTTTGTGCCAACACAGACCGCTTTGGCC MRSYIKVLTMCFLGLILFVPTQTALA
C02 ATGAAAACAAAGACACTGTTCATATTCAGTGCCATTTTAACCCTATCGATATTTGCGCCAAATACAACCTTCGCA MKTKTLFIFSAILTLSIFAPNTTFA

const $=id=>document.getElementById(id);
function loadExample(){$('input').value=EXAMPLE;run()}
function parseInput(txt){
  const items=[];let fasta=null;
  for(const raw of txt.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    if(line[0]==='>'){fasta={name:line.slice(1).trim().split(/\s+/)[0]||('seq'+(items.length+1)),seq:''};items.push(fasta);continue}
    if(fasta&&/^[ACGTacgt\s]+$/.test(line)){fasta.seq+=line.replace(/\s/g,'').toUpperCase();continue}
    fasta=null;
    const p=line.split(/[\s,;\t]+/).filter(Boolean);
    if(p.length===1)items.push({name:'seq'+(items.length+1),seq:p[0].toUpperCase()});
    else items.push({name:p[0],seq:p[1].toUpperCase(),aa:p[2]?p[2].toUpperCase():undefined});
  }
  return items;
}
function cfgFromUI(){
  return {up:$('up').value.trim().toUpperCase(),down:$('down').value.trim().toUpperCase(),
    maxLen:+$('maxLen').value,minOv:+$('minOv').value,maxOv:+$('maxOv').value,tmFloor:+$('tmFloor').value,tmLow:+$('tmLow').value,tmHigh:+$('tmHigh').value,orf:$('orf').checked};
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mapSVG(d){
  const L=d.full.length,W=1040,pad=8,sc=(W-2*pad)/L,x=i=>pad+i*sc,H=150;
  const bar=(a,b,y,col,txt,h=16,op=1)=>`<rect x="${x(a)}" y="${y}" width="${(b-a)*sc}" height="${h}" rx="3" fill="${col}" opacity="${op}"/>`+(txt?`<text x="${x(a)+4}" y="${y+h-4}" style="fill:#fff">${txt}</text>`:'');
  const up=d.cfg.up.length,dn=d.cfg.down.length,spE=L-dn;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(T('map_alt',d.name))}">`;
  s+=`<text class="lbl" x="${pad}" y="12">${T('map_prod',L)}</text>`;
  s+=bar(0,up,18,'var(--arm)',up?T('map_up'):'')+bar(up,spE,18,'var(--sp)',T('map_target',d.sp.length))+bar(spE,L,18,'var(--arm)',dn?T('map_down'):'');
  // 重叠区高亮
  s+=`<rect x="${x(d.ovF.a)}" y="14" width="${(d.ovF.b-d.ovF.a)*sc}" height="26" fill="none" stroke="var(--ink)" stroke-dasharray="3 2" rx="3"/>`;
  s+=`<rect x="${x(d.ovR.a)}" y="14" width="${(d.ovR.b-d.ovR.a)*sc}" height="26" fill="none" stroke="var(--ink)" stroke-dasharray="3 2" rx="3"/>`;
  s+=bar(0,d.F.length,50,'var(--F)',`F ${d.F.length} nt →`);
  s+=bar(d.ovF.a,d.ovR.b,72,'var(--M)',T('map_M',d.M.length));
  s+=bar(d.ovR.a,L,94,'var(--R)',`← R ${d.R.length} nt`);
  s+=`<text class="lbl" x="${x(d.ovF.a)}" y="132">${T('map_ovF',d.ovF.b-d.ovF.a,d.ovF.tm.toFixed(1),d.ovF.gc.toFixed(0))}</text>`;
  s+=`<text class="lbl" x="${Math.min(x(d.ovR.a),W-330)}" y="146">${T('map_ovR',d.ovR.b-d.ovR.a,d.ovR.tm.toFixed(1),d.ovR.gc.toFixed(0))}</text>`;
  return s+'</svg>';
}
function render(results){
  let nOk=0,html='';
  const orderRows=[];
  for(const r of results){
    if(!r.ok){html+=`<div class="card"><div class="sp-head"><b>${esc(r.name)}</b><span class="badge b-bad">${T('fail')}</span></div><div style="color:var(--bad)">${esc(r.error)}</div></div>`;continue}
    const v=r.v,adv=r.adv;nOk+=v.ok?1:0;
    const tier=v.ok?(adv.length?'b-warn':'b-ok'):'b-bad';
    const badge=v.ok?`<span class="badge b-ok">${T('v_ok',v.checks.length)}</span>`:`<span class="badge b-bad">${T('v_bad')}</span>`;
    const mt=Math.min(r.ovF.tm,r.ovR.tm);
    html+=`<div class="card"><div class="sp-head"><b>${esc(r.name)}</b><span>${badge}<span class="badge ${tier}">${adv.length?T('adv_n',adv.length):T('adv_0')}</span><span class="note">${T('meta',r.full.length,mt.toFixed(1))}</span></span></div>`;
    html+=mapSVG(r);
    html+=`<table style="margin-top:8px"><tr><th>${T('th_oligo')}</th><th>${T('th_seq')}</th><th>${T('th_len')}</th><th>${T('th_role')}</th></tr>
      <tr><td><b>${esc(r.name)}_F</b></td><td class="seq">${esc(r.F)}</td><td>${r.F.length}</td><td>${T('role_F',r.ovF.b-r.ovF.a)}</td></tr>
      <tr><td><b>${esc(r.name)}_M</b></td><td class="seq">${esc(r.M)}</td><td>${r.M.length}</td><td>${T('role_M')}</td></tr>
      <tr><td><b>${esc(r.name)}_R</b></td><td class="seq">${esc(r.R)}</td><td>${r.R.length}</td><td>${T('role_R',r.ovR.b-r.ovR.a)}</td></tr></table>`;
    html+=`<details style="margin-top:6px"><summary>${T('det',v.checks.length)}</summary><ul class="chk">${v.checks.map(c=>`<li class="${c.ok?'ok':'bad'}">${c.ok?'✓':'✗'} ${esc(c.msg)}</li>`).join('')}</ul>
      ${v.aa!==null&&v.aa!==undefined?`<div class="note" style="margin-top:4px">${T('tr')}<span class="mono">${esc(v.aa)}</span></div>`:''}</details>`;
    if(adv.length)html+=`<ul class="warns">${adv.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`;
    html+='</div>';
    for(const [suf,seq,role] of [['F',r.F,T('use_F')],['M',r.M,T('use_M')],['R',r.R,T('use_R')]])orderRows.push([r.name+'_'+suf,seq,seq.length,role]);
  }
  const head=`<div class="card"><h2>${T('res_h')}</h2><span class="badge ${nOk===results.length?'b-ok':'b-bad'}">${T('res_badge',nOk,results.length)}</span>
    <div class="legend" style="margin-top:8px"><span><i style="background:var(--arm)"></i>${T('lg_arm')}</span><span><i style="background:var(--sp)"></i>${T('lg_target')}</span><span><i style="background:var(--F)"></i>F</span><span><i style="background:var(--M)"></i>M</span><span><i style="background:var(--R)"></i>R</span><span>${T('lg_ov')}</span></div></div>`;
  let order='',pcr='';
  if(orderRows.length){
    order=`<div class="card"><h2>${T('order_h',orderRows.length)}</h2>
    <div style="margin-bottom:8px"><button onclick="copyOrder()">${T('btn_copy')}</button> <button onclick="downloadOrder()">${T('btn_csv')}</button></div>
    <table><tr><th>${T('th_name')}</th><th>${T('th_seq')}</th><th>${T('th_len')}</th><th>${T('th_use')}</th></tr>${orderRows.map(r=>`<tr><td>${esc(r[0])}</td><td class="seq">${esc(r[1])}</td><td>${r[2]}</td><td>${esc(r[3])}</td></tr>`).join('')}</table>
    <p class="note">${T('order_note',results.find(r=>r.ok).cfg.maxLen)}</p></div>`;
    window.__order=orderRows;
    const lens=results.filter(r=>r.ok).map(r=>r.full.length),prodRange=Math.min(...lens)===Math.max(...lens)?lens[0]:Math.min(...lens)+'–'+Math.max(...lens);
    pcr=`<div class="card"><h2>${T('pcr_h')}</h2>
    <p class="note">${T('pcr_note')}</p>
    <table><tr><th>${T('th_mix')}</th><th>${T('th_prog')}</th></tr><tr><td class="mono" style="font-size:12px">${T('mix')}</td>
    <td class="mono" style="font-size:12px">${T('prog')}</td></tr></table>
    <p class="note">${T('pcr_note2',prodRange)}</p></div>`;
  }
  $('out').innerHTML=head+html+order+pcr;
}
function run(){
  const items=parseInput($('input').value),cfg=cfgFromUI(),res=[];
  for(const it of items){
    if(!/^[ACGT]+$/.test(it.seq)){res.push({name:it.name,ok:false,error:T('err_chars')});continue}
    const d=design(it.name,it.seq,cfg);
    if(d.ok){d.v=verify({up:cfg.up,down:cfg.down,sp:it.seq,F:d.F,M:d.M,R:d.R,maxLen:cfg.maxLen,expectedAA:it.aa,orf:cfg.orf});d.adv=adviceFor(d)}
    res.push(d);
  }
  render(res);window.__results=res;
}
function orderTSV(){return window.__order.map(r=>r.slice(0,3).join('\t')).join('\n')}
function copyOrder(){navigator.clipboard.writeText(orderTSV()).catch(()=>{})}
function downloadOrder(){
  const csv='name,sequence_5to3,length,role\n'+window.__order.map(r=>r.map(x=>/[,"]/.test(x)?'"'+String(x).replace(/"/g,'""')+'"':x).join(',')).join('\n')+'\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='oligo_order.csv';a.click();
}
function applyLang(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
  document.title=T('title');
  for(const el of document.querySelectorAll('[data-i18n]'))el.innerHTML=T(el.dataset.i18n);
  $('lang-zh').setAttribute('aria-pressed',LANG==='zh');
  $('lang-en').setAttribute('aria-pressed',LANG==='en');
}
function setLang(l){
  LANG=l;try{localStorage.setItem('lang',l)}catch(e){}
  applyLang();
  if(window.__results)run();                     // 结果里的文案也跟着切换
}
(function init(){
  let l=null;try{l=localStorage.getItem('lang')}catch(e){}
  if(l!=='zh'&&l!=='en')l=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en';
  LANG=l;applyLang();
  $('input').value=EXAMPLE;run();
})();
window.SPDesigner={design,verify,closure,tm,rc,translate,parseInput,DEFAULTS,setLang,get lang(){return LANG}};
